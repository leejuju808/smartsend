<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .status {
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 16px;
      text-align: center;
    }
    .connected { background: #d4edda; color: #155724; }
    .disconnected { background: #f8d7da; color: #721c24; }
    .btn {
      width: 100%;
      padding: 8px 16px;
      background: #000;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn:hover { background: #333; }
    .btn.secondary {
      background: #6c757d;
    }
    .btn.secondary:hover { background: #5a6268; }
  </style>
</head>
<body>
  <div class="header">
    <h2>SmartSendAI</h2>
    <p style="margin: 0; color: #666; font-size: 14px;">AI-powered email replies</p>
  </div>
  
  <div id="status" class="status disconnected">
    Checking connection...
  </div>
  
  <button id="connectBtn" class="btn" style="display: none;">
    Connect Extension
  </button>
  
  <button id="disconnectBtn" class="btn secondary" style="display: none;">
    Disconnect
  </button>
  
  <script src="popup.js"></script>
</body>
</html>
