<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <h1>SmartSendAI Icon Generator</h1>
    <p>This will generate the required PNG icons for the Chrome extension.</p>
    
    <canvas id="canvas16" width="16" height="16" style="border:1px solid #ccc; margin:10px;"></canvas>
    <canvas id="canvas48" width="48" height="48" style="border:1px solid #ccc; margin:10px;"></canvas>
    <canvas id="canvas128" width="128" height="128" style="border:1px solid #ccc; margin:10px;"></canvas>
    
    <br>
    <button onclick="generateIcons()">Generate Icons</button>
    <button onclick="downloadAll()">Download All Icons</button>
    
    <script>
        function generateIcons() {
            // Generate 16x16 icon
            const canvas16 = document.getElementById('canvas16');
            const ctx16 = canvas16.getContext('2d');
            drawIcon(ctx16, 16);
            
            // Generate 48x48 icon
            const canvas48 = document.getElementById('canvas48');
            const ctx48 = canvas48.getContext('2d');
            drawIcon(ctx48, 48);
            
            // Generate 128x128 icon
            const canvas128 = document.getElementById('canvas128');
            const ctx128 = canvas128.getContext('2d');
            drawIcon(ctx128, 128);
            
            console.log('Icons generated! Right-click each canvas to save as PNG');
        }
        
        function drawIcon(ctx, size) {
            const scale = size / 128;
            
            // Clear canvas
            ctx.clearRect(0, 0, size, size);
            
            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            
            // Draw background circle
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2 - 2, 0, 2 * Math.PI);
            ctx.fill();
            
            // Draw envelope
            ctx.strokeStyle = 'white';
            ctx.lineWidth = Math.max(1, 2 * scale);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const margin = 8 * scale;
            const width = size - 2 * margin;
            const height = width * 0.6;
            const x = margin;
            const y = size/2 - height/2;
            
            // Envelope outline
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + width, y);
            ctx.lineTo(x + width, y + height);
            ctx.lineTo(x, y + height);
            ctx.closePath();
            ctx.stroke();
            
            // Envelope flap
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + width/2, y + height/3);
            ctx.lineTo(x + width, y);
            ctx.stroke();
            
            // AI sparkle
            const sparkleSize = 4 * scale;
            const sparkleX = size * 0.75;
            const sparkleY = size * 0.25;
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.moveTo(sparkleX, sparkleY - sparkleSize);
            ctx.lineTo(sparkleX + sparkleSize/2, sparkleY);
            ctx.lineTo(sparkleX, sparkleY + sparkleSize);
            ctx.lineTo(sparkleX - sparkleSize/2, sparkleY);
            ctx.closePath();
            ctx.fill();
            
            // AI text
            ctx.fillStyle = 'white';
            ctx.font = `${Math.max(8, 12 * scale)}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('AI', size/2, size * 0.85);
        }
        
        function downloadAll() {
            const canvases = ['canvas16', 'canvas48', 'canvas128'];
            const sizes = [16, 48, 128];
            
            canvases.forEach((canvasId, index) => {
                const canvas = document.getElementById(canvasId);
                const link = document.createElement('a');
                link.download = `icon${sizes[index]}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }
        
        // Auto-generate on load
        window.onload = generateIcons;
    </script>
</body>
</html>
