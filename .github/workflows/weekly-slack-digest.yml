name: Weekly Slack Digest
on:
  schedule:
    - cron: "0 16 * * FRI"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Call weekly digest
        run: |
          curl -X POST ${{ secrets.SITE_URL }}/api/integrations/slack/weekly-digest \
            -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}" \
            -H "Content-Type: application/json" 